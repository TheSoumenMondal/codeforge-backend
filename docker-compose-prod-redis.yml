services:
  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--loglevel",
        "warning",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  redis_data:
